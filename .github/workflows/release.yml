# Builds release artifacts and creates a DRAFT GitHub Release.
# Releases are published manually from the draft; publishing starts
# published.yml (checks the files, deploys the project page, checks the page).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Code signing is optional: configure these repository secrets to enable it.
      SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      # Re-pushing an existing tag must never rebuild or re-draft a published release.
      - name: Refuse to touch a published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') {
            Write-Error "Release $env:TAG is already published; nothing to do."
            exit 1
          }
          exit 0

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev/app/src-tauri

      - name: Validate version against tag
        shell: pwsh
        run: node dev/scripts/sync-metadata.mjs --check --tag $env:TAG

      - name: Install and test
        working-directory: dev/app
        run: |
          npm ci
          npm run check
          npm test

      # The bundler calls dev/scripts/sign.ps1 for the exe, the uninstaller and
      # the installer (bundle.windows.signCommand). Without the secrets above
      # the build is unsigned.
      - name: Build (and sign, if configured)
        working-directory: dev/app
        run: npm run app:build

      - name: Package (installer, portable zip, checksums)
        run: node dev/scripts/package-release.mjs

      # Notes = the version's CHANGELOG section + download and first-launch blocks.
      - name: Release notes
        run: node dev/scripts/release-notes.mjs $env:TAG --out dist/RELEASE-NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MDVibe ${{ env.TAG }}
          draft: true
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/MDVibe-Setup.exe
            dist/MDVibe-Setup-*.exe
            dist/MDVibe-*-win-*.zip
            dist/SHA256SUMS.txt

  # macOS disk image: universal (Apple Silicon + Intel), ad-hoc signed, not
  # notarized (no Apple Developer account). Attached to the same draft release.
  release-macos:
    runs-on: macos-latest
    needs: release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev/app/src-tauri

      - name: Validate version against tag
        run: node dev/scripts/sync-metadata.mjs --check --tag "$TAG"

      - name: Install and test
        working-directory: dev/app
        run: |
          npm ci
          npm run check
          npm test

      - name: Build (universal, ad-hoc signed)
        working-directory: dev/app
        run: npm run app:build -- --target universal-apple-darwin

      - name: Package (disk image, checksums)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet "dmgbuild==1.6.5"
          DMGBUILD_PYTHON="$RUNNER_TEMP/dmgbuild/bin/python" node dev/scripts/package-release.mjs --target universal-apple-darwin

      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: |
            dist/MDVibe-mac.dmg
            dist/MDVibe-*-mac-*.dmg
            dist/SHA256SUMS-mac.txt
