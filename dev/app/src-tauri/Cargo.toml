[package]
name = "mdvibe"
version = "0.1.0"
description = "MDVibe — fast, clean Markdown viewer"
authors = ["Andrii Shumak"]
license-file = "../../../LICENSE"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "mdvibe_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
encoding_rs = "0.8"
chardetng = "1"
dunce = "1"
log = { version = "0.4", features = ["std"] }
percent-encoding = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSDocumentController", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSToolbar", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKPreferences", "WKSnapshotConfiguration", "WKWebView", "WKWebViewConfiguration", "block2", "objc2-app-kit"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
